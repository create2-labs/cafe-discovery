name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout (images built with --target ci only; not pushed)
      # go.mod replace => ../cafe-contracts — Docker build context is workspace root below.
      # ------------------------------------------------------------
      - name: Checkout cafe-discovery
        uses: actions/checkout@v5
        with:
          path: cafe-discovery

      - name: Checkout cafe-contracts
        uses: actions/checkout@v5
        with:
          repository: create2-labs/cafe-contracts
          path: cafe-contracts

      # ------------------------------------------------------------
      # Docker / Buildx
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ============================================================
      # BACKEND
      # ============================================================
      - name: Build backend CI image
        run: |
          set -euo pipefail
          docker build \
            --target ci \
            -f cafe-discovery/Dockerfile-discovery-backend \
            -t cafe-discovery-backend:ci .

      - name: Run backend CI checks (inside CI image)
        run: |
          docker run --rm cafe-discovery-backend:ci


