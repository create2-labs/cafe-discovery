openapi: 3.0.3
info:
  title: CAFE Discovery API
  version: "1.0.0"
  license:
    name: Proprietary
    url: https://example.com/license
  description: |
    Target HTTP contract for CAFE Discovery (observation, scans, CAFE wallets) per **WORKPLAN_API.md**
    §0.1, §2.1–2.2, §4.1–4.2, §5.4, §8.

    **Public URL prefix:** `/api/discovery/v1` (edge). Upstream Discovery may receive paths under
    `/discovery/v1/...` after ingress strips `/api` — see `cafe-deploy` / **WORKPLAN_API_PR.md** PR9.

    **CAFE wallets:** HTTP surface is only under **`/wallets`** in this spec (i.e. **`/api/discovery/v1/wallets/...`** at the edge). Discovery does **not** serve a legacy root **`/wallets`** path without the **`/discovery/v1`** prefix.

    **Companion spec (policies):** `cafe-crypto-policy-mgt/openapi/cpm-v1.yaml` (PR1b); correlation
    key is **`scan_id`** (UUID) for Discovery ↔ CPM Option A.

servers:
  - url: https://{host}/api/discovery/v1
    description: Public edge base (canonical).
    variables:
      host:
        default: api.example.com
        description: API host.

tags:
  - name: wallets
    description: CAFE wallets (registered product wallets), distinct from scan-only addresses.
  - name: wallet-scans
    description: Wallet / EVM scan executions and history.
  - name: tls-scans
    description: TLS endpoint scan executions and history.
  - name: scan
    description: Unified trigger for wallet or TLS scans.

security:
  - bearerAuth: []

paths:
  /wallets:
    get:
      tags: [wallets]
      summary: List CAFE wallet identifiers for the authenticated owner
      operationId: listWallets
      responses:
        "200":
          description: List of wallet ids (or synopsis objects including `id`) for the owner.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletListEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [wallets]
      summary: Create a CAFE wallet (owner)
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Wallet created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Wallet already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{wallet_id}:
    parameters:
      - $ref: "#/components/parameters/WalletId"
    get:
      tags: [wallets]
      summary: Get CAFE wallet detail
      operationId: getWallet
      responses:
        "200":
          description: Wallet detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [wallets]
      summary: Update CAFE wallet (owner)
      operationId: updateWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Wallet updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [wallets]
      summary: Delete CAFE wallet (owner)
      description: |
        Does **not** delete associated scan rows (observation history). **409** only if a persisted
        CPM policy references this **`wallet_id` explicitly** (not merely via `scan_id`).
      operationId: deleteWallet
      responses:
        "204":
          description: Wallet removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Wallet referenced by persisted policy (`WALLET_REFERENCED_BY_POLICY`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                walletReferenced:
                  value:
                    error: WALLET_REFERENCED_BY_POLICY
                    message: This wallet is referenced by one or more persisted crypto policies.

  /wallets/scans:
    get:
      tags: [wallet-scans]
      summary: List wallet/EVM scans (synopsis)
      description: |
        Paginated synopsis list. **Default sort:** `created_at` descending, then `scan_id`
        descending (deterministic tie-breaker). **`status`** is **lifecycle only**, not crypto posture.

        **`chain_id` without `address` → 400.** Do not use address in path; use query `address`.
      operationId: listWalletScans
      parameters:
        - $ref: "#/components/parameters/QueryAddress"
        - $ref: "#/components/parameters/QueryChainId"
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Paginated list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedScanList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /wallets/scans/{scan_id}:
    parameters:
      - $ref: "#/components/parameters/ScanId"
    get:
      tags: [wallet-scans]
      summary: Get wallet scan detail
      description: |
        **`result`** may be absent or partial until a terminal lifecycle state; after terminal,
        **`result` is immutable** (WORKPLAN_API.md §2.2, §8.4).
      operationId: getWalletScan
      responses:
        "200":
          description: Detail DTO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletScanDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [wallet-scans]
      summary: Delete wallet scan by scan_id (owner)
      description: |
        **204** | **404** | **409**. **409** if a persisted CPM policy instance references this
        **`scan_id`**. Idempotent second delete → **404**.

        **503 fail-closed** when the authoritative policy reference check is unavailable (**Discovery**
        returns **`POLICY_REFERENCE_CHECK_UNAVAILABLE`**); requires **`CAFE_CPM_INTERNAL_BASE_URL`**
        and **`CAFE_POLICY_REFERENCE_INTERNAL_SERVICE_TOKEN`** on Discovery (see WORKPLAN_API_PR PR6 / PR9).
      operationId: deleteWalletScan
      responses:
        "204":
          description: Scan removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Scan referenced by persisted policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                scanReferenced:
                  value:
                    error: SCAN_REFERENCED_BY_POLICY
                    message: This scan is referenced by one or more persisted crypto policies.
        "503":
          description: |
            Recommended when CPM reference verification cannot be completed (fail-closed); see
            **WORKPLAN_API_PR.md** PR6 (`POLICY_REFERENCE_CHECK_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tls/scans:
    get:
      tags: [tls-scans]
      summary: List TLS scans (synopsis)
      description: |
        Same pagination envelope as wallet scans. **Do not** send `address` or `chain_id`; if
        provided, respond **400** (not applicable to TLS family).
      operationId: listTlsScans
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
        - $ref: "#/components/parameters/QueryOffset"
      responses:
        "200":
          description: Paginated list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTlsScanList"
        "400":
          description: Invalid query (e.g. `address` or `chain_id` present).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tls/scans/{scan_id}:
    parameters:
      - $ref: "#/components/parameters/ScanId"
    get:
      tags: [tls-scans]
      summary: Get TLS scan detail
      operationId: getTlsScan
      responses:
        "200":
          description: TLS scan detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TlsScanDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [tls-scans]
      summary: Delete TLS scan by scan_id (owner)
      description: Same semantics as `DELETE /wallets/scans/{scan_id}` (409 body `SCAN_REFERENCED_BY_POLICY`).
      operationId: deleteTlsScan
      responses:
        "204":
          description: Scan removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Scan referenced by persisted policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Policy reference verification unavailable (fail-closed); see WORKPLAN_API_PR PR6.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scan:
    post:
      tags: [scan]
      summary: Trigger a wallet or TLS scan
      description: |
        Request body must contain **`address`** (EVM) **or** **`url`** (TLS endpoint), mutually
        exclusive. **`scan_id`** is allocated when the execution is **accepted** (`requested`), before
        async pipeline publish (WORKPLAN_API.md §2.2, §8.4).
      operationId: postScan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostScanRequest"
      responses:
        "200":
          description: Scan accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostScanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Scanner or dependency unavailable (if applicable).

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT; owner-scoped resources (WORKPLAN_API.md §4.x).

  parameters:
    WalletId:
      name: wallet_id
      in: path
      required: true
      schema:
        type: string
      description: Internal CAFE wallet identifier (not raw Ethereum address unless explicitly documented by product).
    ScanId:
      name: scan_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryAddress:
      name: address
      in: query
      required: false
      schema:
        type: string
        description: Normalized Ethereum address filter (wallet scans only).
    QueryChainId:
      name: chain_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
      description: Chain refinement; **only** with `address`.
    QueryLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
    QueryOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: Missing or invalid authentication.
    NotFound:
      description: Resource not found or not owner-visible.
    BadRequest:
      description: Invalid request (e.g. mutually exclusive body fields, `chain_id` without `address`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Stable machine-readable code (e.g. SCAN_REFERENCED_BY_POLICY).
        message:
          type: string
          description: Human-readable message.

    ScanLifecycleStatus:
      type: string
      enum: [requested, started, completed, failed]
      description: Lifecycle metadata only — not crypto posture (WORKPLAN_API.md §5.4.1).

    ScanListItem:
      type: object
      required: [scan_id, created_at, status]
      description: Wallet scan synopsis (WORKPLAN_API.md §5.4.2).
      properties:
        scan_id:
          type: string
          format: uuid
        target_address:
          type: string
          description: Required for scans triggered by address when known.
        chain_ids:
          type: array
          items:
            type: integer
            format: int64
          description: May be empty until chains are known.
        created_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ScanLifecycleStatus"

    TLSListItem:
      type: object
      required: [scan_id, endpoint, created_at, status]
      description: TLS scan synopsis (WORKPLAN_API.md §5.4.3).
      properties:
        scan_id:
          type: string
          format: uuid
        endpoint:
          type: string
          description: URL or stable display identifier.
        created_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ScanLifecycleStatus"

    PaginationEnvelope:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    PaginatedScanList:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ScanListItem"

    PaginatedTlsScanList:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TLSListItem"

    WalletScanDetail:
      type: object
      required: [scan_id, status]
      properties:
        scan_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ScanLifecycleStatus"
        result:
          $ref: "#/components/schemas/WalletScanResult"
      description: Detail DTO; `result` per WORKPLAN_API.md §5.4.4.

    WalletScanResult:
      type: object
      description: Business result for wallet scan (distinct from TLS). Minimal target shape §5.4.4.
      properties:
        target_address:
          type: string
        chain_ids:
          type: array
          items:
            type: integer
            format: int64
        wallet_type:
          type: string
          enum: [eoa, smart_account, contract, unknown]
        current_pq_posture:
          type: string
          enum: [pq_ready, hybrid, not_pq_ready, unknown]
        observations:
          type: array
          items: {}

    TlsScanDetail:
      type: object
      required: [scan_id, status]
      properties:
        scan_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ScanLifecycleStatus"
        result:
          $ref: "#/components/schemas/TlsScanResult"

    TlsScanResult:
      type: object
      description: Business result for TLS scan — schema distinct from wallet (WORKPLAN_API.md §5.4.5).
      properties:
        endpoint:
          type: string
        tls_version:
          type: string
        cipher_suite:
          type: string
        key_exchange:
          type: string
        certificate_summary:
          type: object
          additionalProperties: true
        current_pq_posture:
          type: string
          enum: [pq_ready, hybrid, not_pq_ready, unknown]
        observations:
          type: array
          items: {}

    PostScanRequest:
      oneOf:
        - type: object
          required: [address]
          properties:
            address:
              type: string
              description: EVM address (0x-prefixed hex).
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: TLS endpoint URL.

    PostScanResponse:
      type: object
      required: [scan_id, scan_family, status, location]
      properties:
        scan_id:
          type: string
          format: uuid
        scan_family:
          type: string
          enum: [wallet, tls]
        status:
          type: string
          enum: [requested]
          description: Initial lifecycle at acceptance (WORKPLAN_API.md §8.3).
        location:
          type: string
          description: |
            Absolute path under public API for the new scan resource, e.g.
            `/api/discovery/v1/wallets/scans/{scan_id}` or `/api/discovery/v1/tls/scans/{scan_id}`.

    WalletListEntry:
      oneOf:
        - type: string
          description: CAFE wallet id.
        - type: object
          required: [id]
          properties:
            id:
              type: string
            name:
              type: string
          additionalProperties: true

    WalletDetail:
      type: object
      description: CAFE wallet detail (product-specific fields; extend at implementation).
      properties:
        id:
          type: string
      additionalProperties: true
